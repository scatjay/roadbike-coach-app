<!doctype html>
<html lang="zh-Hant">
<head>

<style>body{margin:0;background:#000}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}details>summary{cursor:pointer}</style>

<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

<div class="m-in" style="--i:1;display:flex;flex-direction:column;gap:8px;margin-top:8px">
<div style="color:#bdbdbd;font-size:28px;font-weight:700">同心率</div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="m-count" style="font-family:'Barlow Condensed','Noto Sans TC',system-ui,sans-serif;font-weight:800;font-style:italic;font-size:120px;line-height:0.95;letter-spacing:-1px">19.0</span><span class="m-sweep" style="background:#c6ff00;color:#0b0b0c;font-size:40px;font-weight:900;padding:2px 16px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)">持平</span></div>

</div>
<div style="flex-grow:1"></div>
<div id="q" class="m-in" style="--i:2;display:flex;flex-direction:column;gap:10px">

<div style="color:#bdbdbd;font-size:14px">示意數字 · v2 概念稿</div>
</div>
<nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid #c6ff00;background:#141416;height:64px;font-size:18px"><a href="Home.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">今天</a><a href="Ride.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">路上</a><a href="Post.dc.html" style="display:flex;align-items:center;justify-content:center;background:#c6ff00;color:#0b0b0c;font-weight:900">騎後</a><a href="Coach.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">問教練</a></nav>

<script>
var s=document.getElementById('s');
for(var i=1;i<=5;i++){var b=document.createElement('button');b.type='button';b.className='m-press';b.textContent=i;
b.style.cssText="height:64px;border:3px solid #fff;background:transparent;color:#fff;font-size:28px;font-weight:900;font-family:'Barlow Condensed','Noto Sans TC',sans-serif";
b.onclick=done;s.appendChild(b);}
document.getElementById('skip').onclick=done;
function done(){document.getElementById('q').style.display='none';document.getElementById('done').style.display='block'}
</script>
