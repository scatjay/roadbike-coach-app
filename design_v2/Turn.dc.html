<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>路上折返點1110</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>body{margin:0;background:#000}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}details>summary{cursor:pointer}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;gap:8px"><a href="Start.dc.html" style="padding:4px 14px;border:2px solid;font-size:18px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">出發點</a><a href="Ride.dc.html" style="padding:4px 14px;border:2px solid;font-size:18px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">騎乘中</a><a href="Turn.dc.html" style="padding:4px 14px;border:2px solid;font-size:18px;background:#c6ff00;color:#0b0b0c;font-weight:900;border-color:#c6ff00">折返點</a></div>
<div style="color:#bdbdbd;font-size:18px">折返點 · 已停 12 分 · 休息通常約 36 分</div>
<div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:14px">
<div id="lab" style="color:#bdbdbd;font-size:28px;font-weight:700">回程</div>
<div id="msg" style="font-size:56px;font-weight:900;line-height:1.15">順風<br><span style="color:#c6ff00">剩 19.9 k</span></div>
<div id="sub" style="font-size:20px;color:#bdbdbd;line-height:1.6">去程 22.7 km/h（頂風）· 心率 141<br>手環 車表 在線</div>
</div>
<div id="act" style="display:none;flex-direction:column;gap:8px">
<div id="ok" style="display:none;color:#c6ff00;font-size:28px;font-weight:900">已送出，看手環</div>
<button id="b" type="button" style="height:64px;border:3px solid #ffffff;background:transparent;color:#ffffff;font-size:24px;font-weight:900">震一下手環</button>
</div>
<button id="t" type="button" style="border:0;background:transparent;color:#bdbdbd;font-size:14px;height:24px">（畫板用：切換異常）</button>
<div style="color:#bdbdbd;font-size:14px">示意數字 · v2 概念稿</div>
</div>
<nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid #c6ff00;background:#141416;height:64px;font-size:18px"><a href="Home.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">今天</a><a href="Ride.dc.html" style="display:flex;align-items:center;justify-content:center;background:#c6ff00;color:#0b0b0c;font-weight:900">路上</a><a href="Post.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">騎後</a><a href="Coach.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">問教練</a></nav>
</div>
<script>
var bad=false;
document.getElementById('b').onclick=function(){document.getElementById('ok').style.display='block'};
document.getElementById('t').onclick=function(){bad=!bad;
document.getElementById('lab').textContent=bad?'先處理':'回程';
document.getElementById('msg').innerHTML=bad?'<span style="color:#ff8a5c">手環沒回應</span>':'順風<br><span style="color:#c6ff00">剩 19.9 k</span>';
document.getElementById('sub').innerHTML=bad?'回程提示會先走車表與語音':'去程 22.7 km/h（頂風）· 心率 141<br>手環 車表 在線';
document.getElementById('act').style.display=bad?'flex':'none';};
</script>
</body>
</html>
