<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>路上騎乘中1110</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>body{margin:0;background:#000}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}details>summary{cursor:pointer}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;gap:8px"><a href="Start.dc.html" style="padding:4px 14px;border:2px solid;font-size:22px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">出發點</a><a href="Ride.dc.html" style="padding:4px 14px;border:2px solid;font-size:22px;background:#c6ff00;color:#0b0b0c;font-weight:900;border-color:#c6ff00">騎乘中</a><a href="Turn.dc.html" style="padding:4px 14px;border:2px solid;font-size:22px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">折返點</a></div>
<div class="m-in" style="--i:0;color:#bdbdbd;font-size:22px;line-height:1.6">手機在口袋時螢幕是關的。<br>你拿出來看，才是這一頁。</div>
<div class="m-in" style="--i:1;flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:12px">
<div id="msg" data-b="ride-title" style="font-size:56px;font-weight:900;line-height:1.15;color:#c6ff00">教練在線</div>
<div id="sub" data-b="ride-sub" style="font-size:28px;color:#bdbdbd;font-weight:700">車表最後推送 41 秒前</div>
</div>
<div class="m-in" style="--i:2;font-size:22px;color:#ffffff;line-height:1.4"><div style="color:#bdbdbd;font-size:20px;font-weight:700;padding-bottom:4px">騎程指引・新塭 54 km（11/19）</div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>暖身 0–5 km</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">80–95 W</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>去程前段 5–10 km</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">112–122 W</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>去程主段 10–27 km</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">112–125 W</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>回程前 10 km（27–37）</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">105–118 W</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>回程後段 37–49 km</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">105–115 W</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2a2a2d"><span>收操 49–54 km</span><span style="color:#c6ff00;font-weight:800;white-space:nowrap">75–90 W</span></div><div style="color:#bdbdbd;font-size:20px;line-height:1.5;padding-top:6px">心率連續 30 秒超過 146，不管瓦數幾瓦都降一檔。預報去程逆風，速度慢是正常的。</div></div>
<div id="ok" class="m-in" style="display:none;color:#c6ff00;font-size:28px;font-weight:900" data-b="ok">已送出，看車表、聽語音</div>
<button id="b" type="button" class="m-press" style="height:64px;border:3px solid #ffffff;background:transparent;color:#ffffff;font-size:28px;font-weight:900" data-b-full="1">傳到車表（含語音）</button>
<a href="segmap.html" style="display:block;text-align:center;padding:14px;border:3px solid #4cc3cd;color:#4cc3cd;font-size:26px;font-weight:900;text-decoration:none">賽段區間・看每段瓦數與車友 ›</a>
<div data-b="source" style="color:#bdbdbd;font-size:20px">資料來源：讀取中…</div>
</div>
<nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid #c6ff00;background:#141416;height:64px;font-size:22px"><a href="Home.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">今天</a><a href="Ride.dc.html" style="display:flex;align-items:center;justify-content:center;background:#c6ff00;color:#0b0b0c;font-weight:900">路上</a><a href="Post.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">騎後</a><a href="Coach.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">問教練</a></nav>
</div>
<script>
var bad=false;
document.getElementById('b').onclick=function(){var ok=document.getElementById('ok'),self=this;if(window.RBHeadSay){RBHeadSay.send(ok,self)}else{ok.style.display='block'}};
var tg=document.getElementById('t');if(tg)tg.onclick=function(){bad=!bad;var m=document.getElementById('msg'),s=document.getElementById('sub');
m.textContent=bad?'教練沒回應':'教練在線';m.style.color=bad?'#ff8a5c':'#c6ff00';m.classList.toggle('m-pulse',bad);
s.textContent=bad?'已靜默 6 分鐘':'車表最後推送 41 秒前';};
</script>
</body>
</html>
