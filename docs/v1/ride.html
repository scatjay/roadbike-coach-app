<head>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
<style>html,body{background:#0b0b0c}html.locked body>*:not(#gate){visibility:hidden}</style>
<script>document.documentElement.classList.add("locked")</script>

<body>
<div style="width: 100%; max-width: 430px; min-height: 100dvh; margin: 0 auto; box-sizing: border-box; background: #0b0b0c; color: #ffffff; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="color: #bdbdbd; font-size: 18px; font-weight: 700">回程・順風</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div style="color: #bdbdbd; font-size: 28px; font-weight: 700">心率</div>
<div style="font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif; font-weight: 800; font-style: italic; font-size: 190px; line-height: 0.95; letter-spacing: -1px">141</div>
<div style="position: relative; height: 28px; display: flex; transform: skewX(-20deg)">
<div style="flex: 40 1 0; background: #3a3a3d"></div>
<div style="flex: 26 1 0; background: #c6ff00"></div>
<div style="flex: 34 1 0; background: #ff5a1f"></div>
<div style="position: absolute; left: 41%; top: -6px; width: 6px; height: 40px; background: #ffffff"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: #bdbdbd"><span>100</span><span>146 上限</span><span>180</span></div>
</div>
<button type="button" id="follow" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 24px; font-weight: 900; font-family: inherit">我在跟車（靜音）</button>
</div>
<nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 4px solid #c6ff00; background: #141416; height: 64px; font-size: 15px">
<a href="index.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">今天</a>
<a href="ride.html" style="display: flex; align-items: center; justify-content: center; background: #c6ff00; color: #0b0b0c; font-weight: 900">騎乘中</a>
<a href="post.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">騎後</a>
<a href="trainer.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">訓練台</a>
<a href="coach.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">問教練</a>
</nav>
</div>
<script>
(function(){var f=false,b=document.getElementById('follow');
b.addEventListener('click',function(){f=!f;
b.textContent=f?'跟車靜音中（再按取消）':'我在跟車（靜音）';
b.style.background=f?'#c6ff00':'transparent';b.style.color=f?'#0b0b0c':'#ffffff';
b.style.borderColor=f?'#c6ff00':'#ffffff';});})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
