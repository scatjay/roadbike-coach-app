<body>
<div style="width: 100%; max-width: 430px; min-height: 100dvh; margin: 0 auto; box-sizing: border-box; background: #0b0b0c; color: #ffffff; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="color: #bdbdbd; font-size: 18px; font-weight: 700">11/9（一）吉安宮往返 39.4 km</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
<div style="color: #bdbdbd; font-size: 28px; font-weight: 700">同心率</div>
<div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif; font-weight: 800; font-style: italic; font-size: 120px; line-height: 0.95; letter-spacing: -1px">19.0</span><span style="background: #c6ff00; color: #0b0b0c; font-size: 40px; font-weight: 900; padding: 2px 16px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%)">持平</span></div>
<div style="color: #bdbdbd; font-size: 18px">扣風後效率；近十趟還分不出進步</div>
</div>
<div style="flex-grow: 1"></div>
<div id="stepA" style="display: flex; flex-direction: column; gap: 10px" data-skip="1">
<div style="font-size: 28px; font-weight: 900">還想再騎一趟嗎？</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<button type="button" data-go="1" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">1</button><button type="button" data-go="1" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">2</button><button type="button" data-go="1" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">3</button><button type="button" data-go="1" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">4</button><button type="button" data-go="1" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">5</button>
</div>
<button type="button" data-go="1" style="height: 48px; border: 0; background: transparent; color: #bdbdbd; font-size: 18px; font-family: inherit">略過</button>
</div>
<div id="stepB" style="display: none; flex-direction: column; gap: 10px">
<div style="font-size: 28px; font-weight: 900">今天的提示</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" data-go="2" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">太多</button><button type="button" data-go="2" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">剛好</button><button type="button" data-go="2" style="height: 64px; border: 3px solid #ffffff; background: transparent; color: #ffffff; font-size: 28px; font-weight: 900; font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif">太少</button>
</div>
<button type="button" data-go="2" style="height: 48px; border: 0; background: transparent; color: #bdbdbd; font-size: 18px; font-family: inherit">略過</button>
</div>
<div id="stepC" style="display: none; font-size: 28px; color: #c6ff00; font-weight: 900">記下了，謝謝。</div>
<details style="font-size: 17px; color: #bdbdbd"><summary style="padding: 6px 0">更多</summary>
<div style="line-height: 1.7">146 以下占 74%，最高 155<br>教練說了 32 句、擋 4 句、折返 0 句<br>近十趟扣風效率 16.7–19.9，每週趨勢 +0.16±0.31<br>11/12 基準騎是下一個對照點</div></details>
</div>

</nav>

<script>
(function(){var A=document.getElementById('stepA'),B=document.getElementById('stepB'),C=document.getElementById('stepC');
function go(n){A.style.display=n==0?'flex':'none';B.style.display=n==1?'flex':'none';C.style.display=n==2?'block':'none';}
document.querySelectorAll('[data-go]').forEach(function(e){e.addEventListener('click',function(){go(+e.dataset.go);});});
go(0);})();
</script>
