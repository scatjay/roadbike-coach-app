<title>路上折返點1110</title>

<div style="width:100%;max-width:430px;min-height:100dvh;margin:0 auto;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;gap:8px"><a href="start.html" style="padding:4px 14px;border:2px solid;font-size:22px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">出發點</a><a href="ride.html" style="padding:4px 14px;border:2px solid;font-size:22px;color:#bdbdbd;font-weight:700;border-color:#3a3a3d">騎乘中</a><a href="turn.html" style="padding:4px 14px;border:2px solid;font-size:22px;background:#c6ff00;color:#0b0b0c;font-weight:900;border-color:#c6ff00">折返點</a></div>
<div class="m-in" style="--i:0;color:#bdbdbd;font-size:22px">折返點 · 通道檢查</div>
<div class="m-in" style="--i:1;flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:14px">
<div id="lab" data-b="turn-lab" style="color:#bdbdbd;font-size:28px;font-weight:700">回程</div>
<div id="msg" data-b="turn-msg" style="font-size:56px;font-weight:900;line-height:1.15">教練與車表<br><span style="color:#c6ff00">在線</span></div>
<div id="sub" data-b="turn-sub" style="font-size:24px;color:#bdbdbd;line-height:1.6">回程建議請看車表／語音</div>
</div>
<div id="act" data-b="turn-act" style="display:none;flex-direction:column;gap:8px">
<div id="ok" class="m-in" style="display:none;color:#c6ff00;font-size:28px;font-weight:900" data-b="ok">已送出，看手環</div>
<button id="b" type="button" class="m-press" style="height:64px;border:3px solid #ffffff;background:transparent;color:#ffffff;font-size:28px;font-weight:900">震一下手環</button>
</div>
<div data-b="source" style="color:#bdbdbd;font-size:20px">示意數字 · v2 概念稿</div>
</div>
<nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid #c6ff00;background:#141416;height:64px;font-size:22px"><a href="index.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">今天</a><a href="ride.html" style="display:flex;align-items:center;justify-content:center;background:#c6ff00;color:#0b0b0c;font-weight:900">路上</a><a href="post.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">騎後</a><a href="coach.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">問教練</a></nav>
</div>
<script>
var bad=false;
document.getElementById('b').onclick=function(){document.getElementById('ok').style.display='block'};
var tg=document.getElementById('t');if(tg)tg.onclick=function(){bad=!bad;
document.getElementById('lab').textContent=bad?'先處理':'回程';
document.getElementById('msg').innerHTML=bad?'<span style="color:#ff8a5c">教練沒回應</span>':'教練與車表<br><span style="color:#c6ff00">在線</span>';
document.getElementById('sub').innerHTML=bad?'回程提示會先走車表與語音':'回程建議請看車表／語音';
document.getElementById('act').style.display=bad?'flex':'none';document.getElementById('msg').classList.toggle('m-pulse',bad);};
</script>
