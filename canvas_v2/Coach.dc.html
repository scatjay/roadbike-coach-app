<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
@keyframes m-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes m-sweep{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* m-in：進場（淡入＋上移 12px，280ms）。用 --i 排先後，每級 60ms。 */
html:not(.locked) .m-in{animation:m-in 280ms cubic-bezier(.2,.8,.2,1) calc(var(--i,0) * 60ms) backwards}
/* m-sweep：斜切色塊從左掃入（360ms，等主數字先出場 350ms） */
html:not(.locked) .m-sweep{transform-origin:left center;animation:m-sweep 360ms cubic-bezier(.2,.8,.2,1) 350ms backwards}
/* m-pulse：異常強調，只播 3 次（3 x 360ms = 1.08s）後靜止。畫布版用行內 style 帶同一組參數。 */
html:not(.locked) .m-pulse{transform-origin:left center;animation:m-pulse 360ms cubic-bezier(.2,.8,.2,1) 3}
/* m-press：按壓回饋，90ms */
.m-press{transition:transform 90ms ease-out,opacity 90ms ease-out}
.m-press:active{transform:scale(.97);opacity:.85}

@media (prefers-reduced-motion:reduce){
  html .m-in,html .m-sweep,html .m-pulse,[style*="m-pulse"]{animation:none!important}
  .m-press{transition:none}
  .m-press:active{transform:none;opacity:.7}
}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="color:#bdbdbd;font-size:18px;font-weight:700">問教練</div>
<div class="m-in" style="--i:1;flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:14px">
<div style="color:#bdbdbd;font-size:28px;font-weight:700">逆風日要怎麼騎？</div>
<div style="font-size:48px;font-weight:900;line-height:1.2">逆風守心率，<br><span style="color:#c6ff00">不追速度。</span></div>
<div style="color:#bdbdbd;font-size:18px">書中明說：踏頻與風書卡第 2 節</div>
</div>
<div class="m-in" style="display:{{ heardShow }};color:#bdbdbd;font-size:20px">聽到：「台十七的風怎麼看」（不對就再按一次重說）</div>
<button type="button" class="m-press" onClick="{{ talk }}" style="height:64px;border:3px solid #ffffff;background:transparent;color:#ffffff;font-size:24px;font-weight:900">按著說話</button>
<div style="color:#bdbdbd;font-size:14px">示意數字 · v2 概念稿</div>
</div>
<nav style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid #c6ff00;background:#141416;height:64px;font-size:18px"><a href="Home.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">今天</a><a href="Ride.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">路上</a><a href="Post.dc.html" style="display:flex;align-items:center;justify-content:center;color:#bdbdbd;font-weight:500">騎後</a><a href="Coach.dc.html" style="display:flex;align-items:center;justify-content:center;background:#c6ff00;color:#0b0b0c;font-weight:900">問教練</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { heard: false }; }
  renderVals() {
    return { heardShow: this.state.heard ? 'block' : 'none', talk: () => this.setState({ heard: true }) };
  }
}
</script>
