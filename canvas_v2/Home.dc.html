<title>今天1110</title>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
@keyframes m-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes m-sweep{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* m-in：進場（淡入＋上移 12px，280ms）。用 --i 排先後，每級 60ms。 */
html:not(.locked) .m-in{animation:m-in 280ms cubic-bezier(.2,.8,.2,1) calc(var(--i,0) * 60ms) backwards}
/* m-sweep：斜切色塊從左掃入（360ms，等主數字先出場 350ms） */
html:not(.locked) .m-sweep{transform-origin:left center;animation:m-sweep 360ms cubic-bezier(.2,.8,.2,1) 350ms backwards}
/* m-pulse：異常強調，只播 3 次（3 x 360ms = 1.08s）後靜止。畫布版用行內 style 帶同一組參數。 */
html:not(.locked) .m-pulse{transform-origin:left center;animation:m-pulse 360ms cubic-bezier(.2,.8,.2,1) 3}
/* m-press：按壓回饋，90ms */
.m-press{transition:transform 90ms ease-out,opacity 90ms ease-out}
.m-press:active{transform:scale(.97);opacity:.85}

@media (prefers-reduced-motion:reduce){
  html .m-in,html .m-sweep,html .m-pulse,[style*="m-pulse"]{animation:none!important}
  .m-press{transition:none}
  .m-press:active{transform:none;opacity:.7}
}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0b0b0c;color:#ffffff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;flex-direction:column">
<div style="flex-grow:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

<div class="m-in" style="--i:1;margin-top:24px;display:flex;flex-direction:column;gap:6px">

<div class="m-count" style="font-family:'Barlow Condensed','Noto Sans TC',system-ui,sans-serif;font-weight:800;font-style:italic;font-size:150px;line-height:0.95;letter-spacing:-1px">146</div>
<div style="font-size:28px;font-weight:900;color:#c6ff00">去程別衝</div>
</div>
<div class="m-in" style="--i:2;color:#bdbdbd;font-size:22px;line-height:1.6;margin-top:8px">車表到吉安宮再開 · 踏頻器出門前轉一下曲柄<br>香蕉帶了嗎</div>

<div style="flex-grow:1"></div>

<button type="button" class="m-press" onClick="{{ send }}" style="display:{{ bShow }};height:64px;border:3px solid #ffffff;background:transparent;color:#ffffff;font-size:28px;font-weight:900">震一下手環</button>
<div style="color:#bdbdbd;font-size:20px">示意數字 · v2 概念稿</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() {
