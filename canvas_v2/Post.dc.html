/* m-in：進場（淡入＋上移 12px，280ms）。用 --i 排先後，每級 60ms。 */

html:not(.locked) .m-pulse{transform-origin:left center;animation:m-pulse 360ms cubic-bezier(.2,.8,.2,1) 3}
/* m-press：按壓回饋，90ms */
.m-press{transition:transform 90ms ease-out,opacity 90ms ease-out}
.m-press:active{transform:scale(.97);opacity:.85}

@media (prefers-reduced-motion:reduce){
  html .m-in,html .m-sweep,html .m-pulse,[style*="m-pulse"]{animation:none!important}

  .m-press:active{transform:none;opacity:.7}
}
