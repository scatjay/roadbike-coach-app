<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>騎乘中1110</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0b0c; color: #ffffff; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="color: #bdbdbd; font-size: 18px; font-weight: 700">回程・順風</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div style="color: #bdbdbd; font-size: 28px; font-weight: 700">心率</div>
<div style="font-family: 'Barlow Condensed', 'Noto Sans TC', system-ui, sans-serif; font-weight: 800; font-style: italic; font-size: 190px; line-height: 0.95; letter-spacing: -1px">141</div>
<div style="position: relative; height: 28px; display: flex; transform: skewX(-20deg)">
<div style="flex: 40 1 0; background: #3a3a3d"></div>
<div style="flex: 26 1 0; background: #c6ff00"></div>
<div style="flex: 34 1 0; background: #ff5a1f"></div>
<div style="position: absolute; left: 41%; top: -6px; width: 6px; height: 40px; background: #ffffff"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: #bdbdbd"><span>100</span><span>146 上限</span><span>180</span></div>
</div>
<button type="button" onClick="{{ toggleFollow }}" style="height: 64px; border: 3px solid {{ followBorder }}; background: {{ followBg }}; color: {{ followColor }}; font-size: 24px; font-weight: 900; font-family: inherit">{{ followLabel }}</button>
</div>
<nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 4px solid #c6ff00; background: #141416; height: 64px; font-size: 15px">
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">今天</a>
<a href="Ride.dc.html" style="display: flex; align-items: center; justify-content: center; background: #c6ff00; color: #0b0b0c; font-weight: 900">騎乘中</a>
<a href="Post.dc.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">騎後</a>
<a href="Trainer.dc.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">訓練台</a>
<a href="Coach.dc.html" style="display: flex; align-items: center; justify-content: center; color: #bdbdbd; font-weight: 500">問教練</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { follow: false }; }
  renderVals() {
    const f = this.state.follow;
    return {
      followLabel: f ? '跟車靜音中（再按取消）' : '我在跟車（靜音比較）',
      followBg: f ? '#c6ff00' : 'transparent',
      followColor: f ? '#0b0b0c' : '#ffffff',
      followBorder: f ? '#c6ff00' : '#ffffff',
      toggleFollow: () => this.setState({ follow: !f })
    };
  }
}
</script>
</body>
</html>
